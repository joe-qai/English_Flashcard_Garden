<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="英文闪卡园">
  <rect width="64" height="64" rx="15" fill="#FAF7F0" />
  <!-- 后面斜放的卡片 -->
  <rect x="9" y="17" width="38" height="36" rx="7" fill="#8FBF6E" fill-opacity="0.45"
        transform="rotate(-9 28 35)" />
  <!-- 前面正放的卡片 -->
  <rect x="17" y="11" width="38" height="42" rx="8" fill="#FFFFFF"
        stroke="#2A2A2E" stroke-opacity="0.08" />
  <!-- 卡片顶部色带 -->
  <path d="M17 19a8 8 0 0 1 8-8h22a8 8 0 0 1 8 8v3H17z" fill="#F6A94D" />
  <circle cx="47" cy="16.5" r="2.6" fill="#FFFFFF" fill-opacity="0.85" />
  <!-- Aa -->
  <text x="33" y="42" font-family="ui-sans-serif, 'Segoe UI', system-ui, sans-serif"
        font-size="25" font-weight="800" fill="#2A2A2E" text-anchor="middle">A</text>
  <text x="48" y="42" font-family="ui-sans-serif, 'Segoe UI', system-ui, sans-serif"
        font-size="15" font-weight="700" fill="#EF7E6B" text-anchor="middle">a</text>
  <!-- 卡片底部横线，像闪卡上的释义 -->
  <rect x="23" y="47" width="26" height="2.6" rx="1.3" fill="#2A2A2E" fill-opacity="0.32" />
</svg>