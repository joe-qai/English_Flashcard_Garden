<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>英文闪卡园 · Flashcard Garden</title>
  <meta name="description" content="沪教牛津版（深圳用）小学 1–6 年级教材单元对齐的英文闪卡，英式发音与拼写，配中文释义；生词高亮、点击显示音标，另含场景对话、英文歌谣、中外故事会与互动游戏。" />
  <meta name="theme-color" content="#FAF7F0" />
  <meta name="color-scheme" content="light dark" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="英文闪卡园 · Flashcard Garden" />
  <meta property="og:description" content="覆盖小学 1–6 年级教材单元的双语闪卡：英式发音、生词高亮、点击看音标；含场景对话、英文歌谣、中国故事与互动游戏。" />
  <meta property="og:locale" content="zh_CN" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/style.css?v=20261106w" />
  <script>
    (function(){try{var t=localStorage.getItem('flashcard:theme');if(!t){t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
  </script>
</head>
<body>
<div class="page">
  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-title">
      <img class="topbar-logo" src="favicon.svg" alt="" width="28" height="28" aria-hidden="true" />
      <span class="topbar-name">英文闪卡园</span>
      <span class="topbar-en">Flashcard Garden</span>
    </div>
    <div class="topbar-actions">
      <button id="zh-toggle" class="zh-toggle" type="button" aria-pressed="true" title="当前显示中文，点击隐藏" data-on="on">
        <span class="zh-toggle-label">CN</span>
      </button>
      <button id="jump-games" class="text-btn" type="button"><span aria-hidden>🎮</span> 开始游戏</button>
      <label class="voice-picker" id="voice-picker" hidden title="选择朗读发音，默认使用最自然的英式发音">
        <span class="voice-picker-icon" aria-hidden>🔊</span>
        <select id="voice-select" class="voice-select" aria-label="选择朗读发音"></select>
      </label>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="切换深色模式" title="切换深色模式">
        <span class="icon-moon" aria-hidden>🌙</span>
        <span class="icon-sun" aria-hidden>☀️</span>
      </button>
    </div>
  </div>

  <!-- 5 Tab Navigation -->
  <nav class="tab-nav" aria-label="主导航">
    <button class="tab active" data-tab="words" type="button">
      <span class="tab-icon" aria-hidden>📚</span>
      <span class="tab-label">单词</span>
      <span class="tab-count" id="tab-words-count">770</span>
    </button>
    <button class="tab" data-tab="scenes" type="button">
      <span class="tab-icon" aria-hidden>💬</span>
      <span class="tab-label">情景</span>
      <span class="tab-count" id="tab-scenes-count">28</span>
    </button>
    <button class="tab" data-tab="songs" type="button">
      <span class="tab-icon" aria-hidden>🎵</span>
      <span class="tab-label">音乐</span>
      <span class="tab-count" id="tab-songs-count">24</span>
    </button>
    <button class="tab" data-tab="stories" type="button">
      <span class="tab-icon" aria-hidden>📖</span>
      <span class="tab-label">故事会</span>
      <span class="tab-count" id="tab-stories-count">33</span>
    </button>
    <button class="tab" data-tab="games" type="button">
      <span class="tab-icon" aria-hidden>🎮</span>
      <span class="tab-label">游戏</span>
      <span class="tab-count" id="tab-games-score">0</span>
    </button>
  </nav>

  <!-- ==================== WORDS TAB ==================== -->
  <section id="tab-words" class="tab-panel active" aria-labelledby="tab-words">
    <div class="sub-nav grade-nav" aria-label="年级筛选">
      <button class="pill sub-pill grade-pill is-active" data-grade="all" type="button">全部</button>
      <button class="pill sub-pill grade-pill" data-grade="1" type="button">一年级</button>
      <button class="pill sub-pill grade-pill" data-grade="2" type="button">二年级</button>
      <button class="pill sub-pill grade-pill" data-grade="3" type="button">三年级</button>
      <button class="pill sub-pill grade-pill" data-grade="4" type="button">四年级</button>
      <button class="pill sub-pill grade-pill" data-grade="5" type="button">五年级</button>
      <button class="pill sub-pill grade-pill" data-grade="6" type="button">六年级</button>
      <button class="pill sub-pill grade-pill" data-grade="ext" type="button">拓展</button>
    </div>
    <div class="sub-nav" aria-label="单词场景分组">
      <button class="pill sub-pill is-active" data-group="all" type="button">全部</button>
      <button class="pill sub-pill" data-group="school" type="button">🏫 学校高频</button>
      <button class="pill sub-pill" data-group="life" type="button">🏠 日常生活</button>
      <button class="pill sub-pill" data-group="fun" type="button">🌍 拓展兴趣</button>
    </div>
    <div id="word-cat-nav" class="cat-nav" aria-label="单词分类"></div>
    <main id="word-grid" class="grid"></main>
    <div id="word-empty" class="empty-state" hidden>
      <p class="empty-icon" aria-hidden="true">🌱</p>
      <p id="word-empty-text">该分类暂无单词</p>
    </div>
  </section>

  <!-- ==================== SCENES TAB ==================== -->
  <section id="tab-scenes" class="tab-panel" aria-labelledby="tab-scenes">
    <div class="sub-nav" aria-label="情景分组">
      <button class="pill sub-pill is-active" data-scene-group="all" type="button">全部</button>
      <button class="pill sub-pill" data-scene-group="school" type="button">🏫 学校场景</button>
      <button class="pill sub-pill" data-scene-group="life" type="button">🏠 生活场景</button>
      <button class="pill sub-pill" data-scene-group="fun" type="button">🌍 拓展场景</button>
    </div>
    <div id="scene-tabs" class="scene-tabs" role="tablist" aria-label="对话场景"></div>
    <div id="scene-panel" class="scene-panel" role="tabpanel"></div>
  </section>

  <!-- ==================== SONGS TAB ==================== -->
  <section id="tab-songs" class="tab-panel" aria-labelledby="tab-songs">
    <div id="song-tabs" class="scene-tabs" role="tablist" aria-label="英文歌谣"></div>
    <div id="song-panel" class="scene-panel" role="tabpanel"></div>
  </section>

  <!-- ==================== STORIES TAB ==================== -->
  <section id="tab-stories" class="tab-panel" aria-labelledby="tab-stories">
    <div id="story-tabs" class="scene-tabs" role="tablist" aria-label="故事列表"></div>
    <div id="story-panel" class="scene-panel" role="tabpanel"></div>
  </section>

  <!-- ==================== GAMES TAB ==================== -->
  <section id="tab-games" class="tab-panel" aria-labelledby="tab-games">
    <div class="game-header">
      <div class="game-stats">
        <span class="stat"><span class="stat-val" id="game-correct">0</span><span class="stat-lbl">正确</span></span>
        <span class="stat"><span class="stat-val" id="game-total">0</span><span class="stat-lbl">答题</span></span>
        <span class="stat"><span class="stat-val" id="game-streak">0</span><span class="stat-lbl">连续</span></span>
      </div>
      <div class="game-controls">
        <select id="game-mode" class="game-select">
          <option value="en-zh">英文 → 中文</option>
          <option value="zh-en">中文 → 英文</option>
        </select>
        <select id="game-cat" class="game-select">
          <option value="all">全部分类</option>
        </select>
        <button id="game-start" class="play-btn" type="button">▶ 开始游戏</button>
      </div>
    </div>
    <div id="game-area" class="game-area">
      <div class="game-prompt" id="game-prompt">
        <span class="game-context" id="game-context">选择「开始游戏」开始挑战</span>
        <span class="game-word" id="game-word">🎮</span>
      </div>
      <div class="game-options" id="game-options"></div>
      <div id="game-feedback" class="game-feedback" hidden></div>
    </div>
    <div id="game-scoreboard" class="scoreboard" hidden>
      <h3>🏆 本轮结束</h3>
      <p>正确率：<span id="score-pct">0</span>%</p>
      <p>最长连对：<span id="score-streak">0</span> 题</p>
      <button id="game-restart" class="play-btn" type="button">再来一局</button>
    </div>
  </section>

  <footer class="footer">
    <p>共 <span id="total-count">770</span> 个单词 · <span id="scene-total">28</span> 个场景 · <span id="song-total">24</span> 首歌曲 · <span id="story-total">33</span> 个故事 · 点击卡片听发音</p>
    <p class="footer-sub">纯静态页面 · 无需后端服务</p>
    <p class="footer-sub">语音朗读与音频播放需 Chrome / Safari / Edge；华为、微信等内置浏览器可能无声</p>
  </footer>
</div>

<!-- Data files -->
<script src="assets/words.js?v=20261106w"></script>
<script src="assets/scenes.js?v=20261106w"></script>
<script src="assets/songs.js?v=20261106w"></script>
<script src="assets/stories.js?v=20261106w"></script>
<script src="assets/app.js?v=20261106w"></script>
</body>
</html>
